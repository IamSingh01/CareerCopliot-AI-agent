<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REcruit AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #C9A96E;
      --gold-dark: #9B7A45;
      --obsidian: #0A0A0F;
      --charcoal: #12121A;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(201, 169, 110, 0.18);
      --glass-strong: rgba(255, 255, 255, 0.08);
      --text-primary: #F5F0E8;
      --text-secondary: rgba(245, 240, 232, 0.55);
      --text-muted: rgba(245, 240, 232, 0.3);
      --bot-bubble: rgba(201, 169, 110, 0.12);
      --user-bubble: rgba(201, 169, 110, 0.22);
      --blur: blur(20px);
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--obsidian);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.3s;
    }

    body.light {
      --obsidian: #F8F5EF;
      --charcoal: #EDEAE4;
      --glass: rgba(0, 0, 0, 0.03);
      --glass-border: rgba(155, 122, 69, 0.2);
      --glass-strong: rgba(0, 0, 0, 0.06);
      --text-primary: #1A1208;
      --text-secondary: rgba(26, 18, 8, 0.6);
      --text-muted: rgba(26, 18, 8, 0.35);
      --bot-bubble: rgba(155, 122, 69, 0.1);
      --user-bubble: rgba(155, 122, 69, 0.18);
    }

    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(201, 169, 110, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(201, 169, 110, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 10%, rgba(201, 169, 110, 0.04) 0%, transparent 50%);
      animation: breathe 12s ease-in-out infinite alternate;
    }

    @keyframes breathe {
      0% {
        opacity: 0.6;
        transform: scale(1);
      }

      100% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle, rgba(201, 169, 110, 0.15) 0%, transparent 70%);
      animation: float linear infinite;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      top: -100px;
      left: -100px;
      animation-duration: 20s;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      bottom: -80px;
      right: -80px;
      animation-duration: 25s;
      animation-delay: -8s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      top: 40%;
      left: 60%;
      animation-duration: 18s;
      animation-delay: -4s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(20px, -20px) scale(1.05);
      }

      50% {
        transform: translate(-10px, 20px) scale(0.97);
      }

      75% {
        transform: translate(15px, 10px) scale(1.03);
      }
    }

    .theme-toggle {
      position: fixed;
      bottom: 32px;
      left: 32px;
      z-index: 1000;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--blur);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.3s;
    }

    .theme-toggle:hover {
      border-color: var(--gold);
      background: rgba(201, 169, 110, 0.08);
    }

    body.light .theme-toggle {
      background: rgba(0, 0, 0, 0.06);
      border-color: rgba(155, 122, 69, 0.2);
    }

    .chat-trigger {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 1000;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 24px rgba(201, 169, 110, 0.4);
      transition: transform 0.3s, box-shadow 0.3s;
      color: var(--obsidian);
    }

    .chat-trigger:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 32px rgba(201, 169, 110, 0.5);
    }

    .chat-trigger svg {
      width: 26px;
      height: 26px;
    }

    .chat-trigger::after {
      content: 'Chat with Alex (Ctrl+Shift+C)';
      position: absolute;
      bottom: 110%;
      right: 0;
      background: var(--charcoal);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      font-size: 0.72rem;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.2s;
    }

    .chat-trigger:hover::after {
      opacity: 1;
      transform: translateY(0);
    }

    #chat-window {
      position: fixed;
      bottom: 104px;
      right: 32px;
      z-index: 999;
      width: 390px;
      height: 580px;
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(32px) saturate(150%);
      -webkit-backdrop-filter: blur(32px) saturate(150%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      transform-origin: bottom right;
      transform: scale(0.85) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #chat-window.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    body.light #chat-window {
      background: rgba(248, 245, 239, 0.85);
    }

    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--glass-border);
      background: linear-gradient(135deg, rgba(201, 169, 110, 0.08) 0%, transparent 100%);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    body.light .chat-header {
      background: linear-gradient(135deg, rgba(201, 169, 110, 0.1) 0%, transparent 100%);
    }

    .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--obsidian);
      flex-shrink: 0;
      position: relative;
    }

    .chat-avatar::after {
      content: '';
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3CB37A;
      border: 2px solid var(--obsidian);
    }

    body.light .chat-avatar::after {
      border-color: #F8F5EF;
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .chat-header-status {
      font-size: 0.72rem;
      color: #3CB37A;
      margin-top: 2px;
    }

    .chat-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.2rem;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s;
      line-height: 1;
    }

    .chat-close:hover {
      color: var(--text-primary);
      background: var(--glass);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 4px;
    }

    .msg-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .msg-wrapper.user {
      flex-direction: row-reverse;
    }

    .msg-avatar-sm {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--obsidian);
    }

    .msg-wrapper.user .msg-avatar-sm {
      background: var(--glass-strong);
      color: var(--text-secondary);
      border: 1px solid var(--glass-border);
    }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.85rem;
      line-height: 1.55;
      word-break: break-word;
      animation: bubbleIn 0.3s ease;
    }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bubble.bot {
      background: var(--bot-bubble);
      border: 1px solid rgba(201, 169, 110, 0.15);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
    }

    .bubble.user {
      background: var(--user-bubble);
      border: 1px solid rgba(201, 169, 110, 0.25);
      border-bottom-right-radius: 4px;
      color: var(--text-primary);
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.5;
      animation: typingDot 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingDot {

      0%,
      60%,
      100% {
        opacity: 0.3;
        transform: scale(1)
      }

      30% {
        opacity: 1;
        transform: scale(1.3)
      }
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 16px 0;
    }

    .qr-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-secondary);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }

    .qr-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201, 169, 110, 0.06);
    }

    .chat-input-area {
      padding: 16px;
      border-top: 1px solid var(--glass-border);
      background: rgba(10, 10, 15, 0.5);
    }

    body.light .chat-input-area {
      background: rgba(248, 245, 239, 0.5);
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #chat-input {
      flex: 1;
      padding: 12px 16px;
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.85rem;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    #chat-input:focus {
      border-color: rgba(201, 169, 110, 0.4);
    }

    #chat-input::placeholder {
      color: var(--text-muted);
    }

    #chat-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      color: var(--obsidian);
    }

    #chat-send:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 16px rgba(201, 169, 110, 0.3);
    }

    #chat-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    #chat-send svg {
      width: 18px;
      height: 18px;
    }

    .chat-footer-note {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 10px;
      letter-spacing: 0.06em;
    }

    @media (max-width: 768px) {
      #chat-window {
        width: calc(100vw - 24px);
        height: 75vh;
        bottom: 90px;
        right: 12px;
        border-radius: 20px;
      }

      .chat-trigger {
        bottom: 20px;
        right: 20px;
      }

      .theme-toggle {
        bottom: 20px;
        left: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-canvas"></div>
  <div class="grain"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <button class="theme-toggle" id="theme-toggle">🌙</button>

  <button class="chat-trigger" id="chat-trigger" onclick="toggleChat()" aria-label="Open chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
  </button>

  <div id="chat-window">
    <div class="chat-header">
      <div class="chat-avatar">A</div>
      <div class="chat-header-info">
        <div class="chat-header-name">Alex AI</div>
        <div class="chat-header-status">● Online now</div>
      </div>
      <button class="chat-close" onclick="toggleChat()">✕</button>
    </div>

    <div class="chat-messages" id="chat-messages"></div>

    <div class="quick-replies" id="quick-replies">
      <button class="qr-btn" onclick="sendQuick('I want to hire talent')">Hire Talent</button>
      <button class="qr-btn" onclick="sendQuick('I\'m looking for a job')">Find a Job</button>
      <button class="qr-btn" onclick="sendQuick('Tell me about pricing')">Pricing</button>
    </div>

    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="Type a message…" rows="1" onkeydown="handleKey(event)"></textarea>
        <button id="chat-send" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </div>
      <div class="chat-footer-note">Powered by REcruit AI · Groq LLaMA 3.3</div>
    </div>
  </div>

  <script>
    const API_URL =
      'https://ai-agent-backend-ddni.onrender.com/api/chat';

    let chatOpen = false;
    let messages = [];
    let isTyping = false;
    let initialized = false;
    let isLight = false;

    document.getElementById('theme-toggle').addEventListener('click', () => {
      isLight = !isLight;
      document.body.classList.toggle('light', isLight);
      document.getElementById('theme-toggle').textContent = isLight ? '🌑' : '🌙';
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.code === 'KeyC') {
        e.preventDefault();
        toggleChat();
      }
    });

    function toggleChat() {
      chatOpen = !chatOpen;
      document.getElementById('chat-window').classList.toggle('open', chatOpen);
      if (chatOpen && !initialized) initChat();
      if (chatOpen) setTimeout(() => document.getElementById('chat-input').focus(), 400);
    }

    async function initChat() {
      initialized = true;
      showTyping();
      await delay(1200);
      hideTyping();
      addBotMessage("Hello! I'm Alex, your REcruit consultant. 👋\n\nAre you an **employer** looking to hire top talent, or a **candidate** exploring new opportunities?\n\nEither way, I'm here to help — and remember, our service is always free for candidates!");
      hideQuickReplies();
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || isTyping) return;

      hideQuickReplies();
      addUserMessage(text);
      input.value = '';

      messages.push({ role: 'user', content: text });

      showTyping();
      isTyping = true;
      document.getElementById('chat-send').disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Server error');
        }

        const data = await res.json();
        const reply = data.message;

        hideTyping();
        addBotMessage(reply);
        messages.push({ role: 'assistant', content: reply });

      } catch (err) {
        hideTyping();
        addBotMessage("I'm having a little trouble connecting right now. Please email us directly at **contact@-dubai.com** or call **+971 4 400 0000** — we'd love to help! 🙏");
        console.error('Chat error:', err);
      } finally {
        isTyping = false;
        document.getElementById('chat-send').disabled = false;
      }
    }

    function sendQuick(text) {
      document.getElementById('chat-input').value = text;
      sendMessage();
    }

    function addBotMessage(text) {
      const msgs = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper bot';
      wrapper.innerHTML = `<div class="msg-avatar-sm">A</div><div class="bubble bot">${formatText(text)}</div>`;
      msgs.appendChild(wrapper);
      scrollToBottom();
    }

    function addUserMessage(text) {
      const msgs = document.getElementById('chat-messages');
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper user';
      wrapper.innerHTML = `<div class="msg-avatar-sm">U</div><div class="bubble user">${escHtml(text)}</div>`;
      msgs.appendChild(wrapper);
      scrollToBottom();
    }

    function formatText(text) {
      return escHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br/>');
    }

    function escHtml(t) {
      return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showTyping() {
      const msgs = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.className = 'msg-wrapper bot'; el.id = 'typing-indicator';
      el.innerHTML = '<div class="msg-avatar-sm">A</div><div class="bubble bot typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      msgs.appendChild(el);
      scrollToBottom();
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function hideQuickReplies() {
      document.getElementById('quick-replies').style.display = 'none';
    }

    function scrollToBottom() {
      const msgs = document.getElementById('chat-messages');
      msgs.scrollTop = msgs.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
  </script>
</body>

</html>
