<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerCopilot AI Chat</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#000;min-height:100vh;overflow:hidden;font-family:'DM Sans',sans-serif}
.chat-trigger{position:fixed;bottom:32px;right:32px;z-index:1000;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#C9A96E 0%,#9B7A45 100%);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(201,169,110,0.4);transition:transform .3s,box-shadow .3s;color:#0A0A0F}
.chat-trigger:hover{transform:scale(1.1);box-shadow:0 8px 32px rgba(201,169,110,0.5)}
.chat-trigger svg{width:26px;height:26px}
#chat-trigger::after{content:'Chat with CareerCopilot (Ctrl+Shift+C)';position:absolute;bottom:110%;right:0;background:#12121A;border:1px solid rgba(201,169,110,0.18);color:#F5F0E8;font-size:.72rem;padding:6px 12px;border-radius:20px;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(4px);transition:all .2s}
#chat-trigger:hover::after{opacity:1;transform:translateY(0)}
#chat-window{position:fixed;bottom:104px;right:32px;z-index:999;width:390px;height:580px;background:rgba(10,10,15,.92);backdrop-filter:blur(32px) saturate(150%);-webkit-backdrop-filter:blur(32px) saturate(150%);border:1px solid rgba(201,169,110,.18);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6);transform-origin:bottom right;transform:scale(.85) translateY(20px);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
#chat-window.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all}
.chat-header{padding:20px 24px;border-bottom:1px solid rgba(201,169,110,.18);background:linear-gradient(135deg,rgba(201,169,110,.08) 0%,transparent 100%);display:flex;align-items:center;gap:14px}
.chat-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#9B7A45 0%,#C9A96E 100%);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;font-weight:600;color:#0A0A0F;flex-shrink:0;position:relative}
.chat-avatar::after{content:'';position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:#3CB37A;border:2px solid #0A0A0F}
.chat-header-info{flex:1}
.chat-header-name{font-size:.95rem;font-weight:600;color:#F5F0E8}
.chat-header-status{font-size:.72rem;color:#3CB37A;margin-top:2px}
.chat-close{background:none;border:none;cursor:pointer;color:rgba(245,240,232,.3);font-size:1.2rem;padding:4px;border-radius:6px;transition:all .2s;line-height:1}
.chat-close:hover{color:#F5F0E8;background:rgba(255,255,255,.04)}
.chat-messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-track{background:transparent}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(201,169,110,.18);border-radius:4px}
.msg-wrapper{display:flex;align-items:flex-end;gap:8px}
.msg-wrapper.user{flex-direction:row-reverse}
.msg-avatar-sm{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#9B7A45,#C9A96E);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;color:#0A0A0F}
.msg-wrapper.user .msg-avatar-sm{background:rgba(255,255,255,.08);color:rgba(245,240,232,.55);border:1px solid rgba(201,169,110,.18)}
.bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:.85rem;line-height:1.55;word-break:break-word;animation:bubbleIn .3s ease}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.bubble.bot{background:rgba(201,169,110,.12);border:1px solid rgba(201,169,110,.15);border-bottom-left-radius:4px;color:#F5F0E8}
.bubble.user{background:rgba(201,169,110,.22);border:1px solid rgba(201,169,110,.25);border-bottom-right-radius:4px;color:#F5F0E8}
.typing-indicator{display:flex;align-items:center;gap:5px;padding:14px 16px}
.dot{width:7px;height:7px;border-radius:50%;background:#C9A96E;opacity:.5;animation:typingDot 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes typingDot{0%,60%,100%{opacity:.3;transform:scale(1)}30%{opacity:1;transform:scale(1.3)}}
.quick-replies{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 0}
.qr-btn{padding:7px 14px;border-radius:20px;border:1px solid rgba(201,169,110,.18);background:rgba(255,255,255,.04);color:rgba(245,240,232,.55);font-size:.75rem;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.qr-btn:hover{border-color:#C9A96E;color:#C9A96E;background:rgba(201,169,110,.06)}
.chat-input-area{padding:16px;border-top:1px solid rgba(201,169,110,.18);background:rgba(10,10,15,.5)}
.chat-input-row{display:flex;gap:10px;align-items:flex-end}
#chat-input{flex:1;padding:12px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(201,169,110,.18);border-radius:16px;color:#F5F0E8;font-family:'DM Sans',sans-serif;font-size:.85rem;resize:none;outline:none;min-height:44px;max-height:120px;transition:border-color .2s;line-height:1.5}
#chat-input:focus{border-color:rgba(201,169,110,.4)}
#chat-input::placeholder{color:rgba(245,240,232,.3)}
#chat-send{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#C9A96E 0%,#9B7A45 100%);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;color:#0A0A0F}
#chat-send:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(201,169,110,.3)}
#chat-send:disabled{opacity:.4;cursor:not-allowed;transform:none}
#chat-send svg{width:18px;height:18px}
.chat-footer-note{text-align:center;font-size:.65rem;color:rgba(245,240,232,.3);margin-top:10px;letter-spacing:.06em}
@media(max-width:768px){
  #chat-window{width:calc(100vw - 24px);height:75vh;bottom:90px;right:12px;border-radius:20px}
  .chat-trigger{bottom:20px;right:20px}
}
</style>
</head>
<body>

<button id="chat-trigger" class="chat-trigger" onclick="toggleChat()" aria-label="Open chat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
</button>

<div id="chat-window">
  <div class="chat-header">
    <div class="chat-avatar">A</div>
    <div class="chat-header-info">
      <div class="chat-header-name">CareerCopilot — CareerCopilot</div>
      <div class="chat-header-status">● Online now</div>
    </div>
    <button class="chat-close" onclick="toggleChat()">✕</button>
  </div>

  <div class="chat-messages" id="chat-messages"></div>

  <div class="quick-replies" id="quick-replies">
    <button class="qr-btn" onclick="sendQuick('I want to hire talent')">Hire Talent</button>
    <button class="qr-btn" onclick="sendQuick('I\'m looking for a job')">Find a Job</button>
    <button class="qr-btn" onclick="sendQuick('Tell me about pricing')">Pricing</button>
  </div>

  <div class="chat-input-area">
    <div class="chat-input-row">
      <textarea id="chat-input" placeholder="Type a message…" rows="1" onkeydown="handleKey(event)"></textarea>
      <button id="chat-send" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="chat-footer-note">Powered by CareerCopilot · Groq LLaMA 3.3</div>
  </div>
</div>

<script>
const API_URL = 'http://localhost:3001/api/chat'

let chatOpen = false
let messages = []
let isTyping = false
let initialized = false

document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.code === 'KeyC') {
    e.preventDefault()
    toggleChat()
  }
})

function toggleChat() {
  chatOpen = !chatOpen
  document.getElementById('chat-window').classList.toggle('open', chatOpen)
  if (chatOpen && !initialized) initChat()
  if (chatOpen) setTimeout(() => document.getElementById('chat-input').focus(), 400)
}

async function initChat() {
  initialized = true
  showTyping()
  await delay(1200)
  hideTyping()
  addBotMessage("Hello! I'm CareerCopilot, your RecruitME consultant. 👋\n\nAre you an **employer** looking to hire top talent, or a **candidate** exploring new opportunities?\n\nEither way, I'm here to help and remember, our service is always free for candidates!")
  hideQuickReplies()
}

async function sendMessage() {
  const input = document.getElementById('chat-input')
  const text = input.value.trim()
  if (!text || isTyping) return

  hideQuickReplies()
  addUserMessage(text)
  input.value = ''

  messages.push({ role: 'user', content: text })

  showTyping()
  isTyping = true
  document.getElementById('chat-send').disabled = true

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    })

    if (!res.ok) {
      const err = await res.json()
      throw new Error(err.error || 'Server error')
    }

    const data = await res.json()
    const reply = data.message

    hideTyping()
    addBotMessage(reply)
    messages.push({ role: 'assistant', content: reply })

  } catch (err) {
    hideTyping()
    addBotMessage("I'm having a little trouble connecting right now. Please email us directly at **contact@recruitme-dubai.com** or call **+971 4 400 0000** — we'd love to help! 🙏")
    console.error('Chat error:', err)
  } finally {
    isTyping = false
    document.getElementById('chat-send').disabled = false
  }
}

function sendQuick(text) {
  document.getElementById('chat-input').value = text
  sendMessage()
}

function addBotMessage(text) {
  const msgs = document.getElementById('chat-messages')
  const wrapper = document.createElement('div')
  wrapper.className = 'msg-wrapper bot'
  wrapper.innerHTML = `
    <div class="msg-avatar-sm">A</div>
    <div class="bubble bot">${formatText(text)}</div>
  `
  msgs.appendChild(wrapper)
  scrollToBottom()
}

function addUserMessage(text) {
  const msgs = document.getElementById('chat-messages')
  const wrapper = document.createElement('div')
  wrapper.className = 'msg-wrapper user'
  wrapper.innerHTML = `
    <div class="msg-avatar-sm">U</div>
    <div class="bubble user">${escHtml(text)}</div>
  `
  msgs.appendChild(wrapper)
  scrollToBottom()
}

function formatText(text) {
  return escHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br/>')
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function showTyping() {
  const msgs = document.getElementById('chat-messages')
  const el = document.createElement('div')
  el.className = 'msg-wrapper bot'; el.id = 'typing-indicator'
  el.innerHTML = '<div class="msg-avatar-sm">A</div><div class="bubble bot typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'
  msgs.appendChild(el)
  scrollToBottom()
}

function hideTyping() {
  const el = document.getElementById('typing-indicator')
  if (el) el.remove()
}

function hideQuickReplies() {
  document.getElementById('quick-replies').style.display = 'none'
}

function scrollToBottom() {
  const msgs = document.getElementById('chat-messages')
  msgs.scrollTop = msgs.scrollHeight
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)) }
</script>
</body>
</html>
